{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pizzaria Roma{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Carregando...</p>
    </div>
<header class="header">
    <div class="container">
        <a href="{% url 'cardapio' %}" class="logo">🍕 Pizzaria Roma</a>
        <nav>
            <a href="{% url 'cardapio' %}">Cardápio</a>
            <a href="{% url 'ver_carrinho' %}">Carrinho</a>
            <a href="{% url 'acompanhar_pedido' %}">Meu Pedido</a>
        </nav>
    </div>
</header>
<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <p>&copy; 2026 Pizzaria Roma — Projeto Didático IESB</p>
</footer>
<script src="{% static 'js/loading.js' %}" defer></script>
</body>
</html>
